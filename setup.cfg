# Root-level flake8 config (2026-11-02): the canonical tool config lives in
# world/setup.cfg, and CI runs `python -m flake8 .` from world/ -- but an
# agent's sandbox cwd is the repository ROOT, and flake8 reads config only
# from the current directory. A pipeline run from there linted the stitched
# *_parts headers with no per-file-ignores and failed on pre-existing
# fragment noise (task-2892's webhook work died exactly this way), and it
# also crawled every sandbox copy in sandboxes_archive. This file mirrors
# world/setup.cfg's [flake8] section, anchored to lint ONLY the live source
# tree (world/, minus its tests and staging) so the same command is green
# and fast from either directory. The *_parts directories are ordered source
# fragments exec'd into one shared namespace (see sim.py): cross-part names,
# imports, and mid-fragment import placement are defined by another fragment,
# so those findings are false positives, not defects.

[flake8]
max-line-length = 100
extend-ignore =
    # Style only -- the codebase predates a gate and uses these deliberately.
    E501, E203, E128, E127, E131, E221, E225, E231, E302, E303, E305, E306,
    E701, E741, E731, E702, W292, W391, W605,
exclude = .git/*,
    .http_cache/*,
    .pytest_cache/*,
    .secret_keys/*,
    __pycache__/*,
    agents/*,
    datasets/*,
    design-references/*,
    evals/*,
    library/*,
    sandboxes/*,
    sandboxes_archive/*,
    scripts/*,
    tinyprobe_test/*,
    think-tank-db-backups/*,
    world/tests/*,
    world/.selfedit_staging/*,
    world/.selfedit_failed/*

per-file-ignores =
    */sim_parts/*.py: F821,F401,E402
    */serve_parts/*.py: F821,F401,E402
    */config_parts/*.py: F821,F401,E402
    */selfedit_parts/*.py: F821,F401,E402
    */content_parts/*.py: F821,F401,E402
    */bank_parts/*.py: F821,F401,E402
    world/serve.py: F821
