# AI Think Tank -- Python tooling config (Cut 3).
# One file for flake8 + mypy + bandit. bandit/pytest-cov are invoked directly
# from tests/run_all.sh so their settings live here.
#
# The codebase is ~12.8k lines written before any gate existed. The stylistic
# codes ignored here (E501 line-length, E20x/E30x layout, E702 semicolons,
# E741 l-value, E731 lambda, W292/W605) are cosmetic -- the SUBSTANTIVE gates
# are the F-codes (real bugs: unused imports/vars, shadowed imports, needless
# f-strings) which are NOT ignored and are kept clean, plus mypy (type errors),
# bandit (security), and pytest coverage. Fix the substance, not the line art.

[flake8]
max-line-length = 100
extend-ignore =
    # Style only -- the codebase predates a gate and uses these deliberately.
    E501, E203, E128, E127, E131, E221, E225, E231, E302, E303, E305, E306,
    E701, E741, E731, E702, W292, W391, W605,
exclude = tests
# The *_parts directories are ordered source fragments exec'd into one shared
# namespace (see sim.py). Cross-part names, imports, and mid-fragment import
# placement are therefore defined by another fragment, so those findings are
# false positives, not defects.
per-file-ignores =
    */sim_parts/*.py: F821,F401,E402
    */serve_parts/*.py: F821,F401,E402
    */config_parts/*.py: F821,F401,E402
    */selfedit_parts/*.py: F821,F401,E402
    */content_parts/*.py: F821,F401,E402
    */bank_parts/*.py: F821,F401,E402
    serve.py: F821

[bandit]
# Intentional patterns, all Low severity / High confidence: the try/except: pass
# blocks are deliberate fail-closed guards (e.g. cache stores), and B404 is the
# `import subprocess` that the Colab sandbox assistant is explicitly allowed to
# reach. B102 is the `# parts:` loader exec in serve/sim/content/selfedit; that
# is how the ordered fragments are assembled, not untrusted input. The remaining
# noise in a full run is all Low severity.
skips = B110,B404,B102

[mypy]
python_version = 3.11
ignore_missing_imports = True
# Not --strict: sim.py lazily imports serve and visa versa, and full strictness
# on a 12.8k-line legacy-heavy codebase produces config-theater rather than
# real safety. These flags catch actual type errors (mismatched args, wrong
# dict access) without demanding an annotation on every helper.
show_error_codes = True
warn_unused_ignores = True
[mypy-serve]
# serve.py is a pure `# parts:` loader: it exec()s the ordered fragments into
# its own globals, so mypy cannot see names defined by a later fragment.
disable_error_code = name-defined,has-type,used-before-def
