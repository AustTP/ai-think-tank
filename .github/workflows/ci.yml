name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python deps
        run: python -m pip install -r requirements.txt

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Environment template guard
        working-directory: world
        run: python -m pytest tests/core/test_env_template.py -q

      - name: Growth guard
        run: python scripts/check_file_growth.py

      - name: Module boundaries
        run: python scripts/check_module_boundaries.py

      - name: Business process map
        run: python scripts/check_business_processes.py

      - name: Eval cases
        run: python evals/run_evals.py --dry-run

      - name: Model configuration
        run: python scripts/check_models.py

      - name: flake8
        working-directory: world
        run: python -m flake8 .

      - name: mypy
        working-directory: world
        run: python -m mypy serve.py sim.py content.py selfedit.py

      - name: bandit
        working-directory: world
        run: python -m bandit --ini setup.cfg -q serve.py sim.py content.py selfedit.py

      - name: Git identity for sandbox tests
        run: |
          git config --global user.email "ci@aithinktank.local"
          git config --global user.name "CI"

      - name: Playwright chromium (browser tests)
        run: python -m playwright install --with-deps chromium

      # The suite used to run as one step and the runner killed it ~2min in,
      # losing all localization. Per-directory steps bound any kill to one
      # directory and let the rest of the suite report independently.
      - name: Test suite -- tests/agent
        working-directory: world
        run: python -m pytest tests/agent -v --tb=no -p no:cacheprovider
      - name: Test suite -- tests/core
        working-directory: world
        run: python -m pytest tests/core -v --tb=no -p no:cacheprovider
      - name: Test suite -- tests/integrations
        working-directory: world
        run: python -m pytest tests/integrations -v --tb=no -p no:cacheprovider
      - name: Test suite -- tests/server
        working-directory: world
        run: python -m pytest tests/server -v --tb=no -p no:cacheprovider
      - name: Test suite -- tests/tools
        working-directory: world
        run: python -m pytest tests/tools -v --tb=no -p no:cacheprovider
      - name: Test suite -- tests/village + JS harnesses
        working-directory: world
        run: |
          python -m pytest tests/village -v --tb=no -p no:cacheprovider
          node tests/js_coverage.mjs

      - name: Coverage gate (world Python + JavaScript, 90% floor)
        run: |
          bash world/tests/run_cov_all_py.sh
          node world/tests/js_coverage.mjs
