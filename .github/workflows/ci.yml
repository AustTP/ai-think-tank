name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python deps
        run: python -m pip install -r requirements.txt

      - name: flake8
        working-directory: world
        run: python -m flake8 .

      - name: mypy
        working-directory: world
        run: python -m mypy serve.py sim.py content.py web_helpers.py sim_helpers.py bank.py auth.py notify.py

      - name: bandit
        working-directory: world
        run: python -m bandit --ini setup.cfg -q serve.py sim.py content.py web_helpers.py sim_helpers.py bank.py auth.py notify.py

      - name: Full test suite (Python unittest files + JS harnesses)
        working-directory: world
        run: bash tests/run_all.sh

      - name: pytest (all Python tests, including gap suites)
        working-directory: world
        run: python -m pytest tests/ -q